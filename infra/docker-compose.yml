name: interview-insights

# Default (`docker compose up`): Postgres + OpenSearch + Mailpit +
# Redpanda. `api`/`web` run directly on the host via npm for the fast
# local-dev loop (see README.md) — no code talks to Redis yet, so that
# isn't run either until something actually depends on it
# (docs/DECISIONS.md D9: avoid premature infrastructure). OpenSearch was
# added here for Phase 5 (GitHub issue #21); Mailpit for Phase 16 (GitHub
# issue #144); Redpanda for Phase 30 (GitHub issue #330, D53) — the first
# real trigger for each, per that same D9 reasoning. Redpanda is broker
# infra only at this point: nothing publishes or consumes yet (that's
# GitHub issue #332), same "proven reachable, unused" state OpenSearch
# briefly had between #21 and its first real indexing call.
#
# `docker compose --profile full up --build`: also builds and runs `api`
# and `web` as containers, for prod-like local testing of the actual Docker
# images (GitHub issue #17) — migrations are applied automatically on
# container start (see api/Dockerfile's CMD).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interview_insights
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # No persistence — Mailpit's own mailbox history is fine to lose on
  # restart, unlike Postgres/OpenSearch's real data (D24/D26); no volume.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Kafka-API-compatible broker (GitHub issue #330, D53) — single-node,
  # `dev-container` mode (Redpanda's own recommended mode for a lone
  # container instance: relaxed fsync/memory defaults, no multi-broker
  # gossip setup needed). `--advertise-kafka-addr` uses this service's own
  # DNS name so the same value also works unchanged from inside the
  # cluster (infra/k8s/base/09-redpanda.yaml mirrors this exactly) —
  # single broker, headless-equivalent addressing either way.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    profiles: ["full"]
    build:
      context: ../api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/interview_insights?schema=public
      EMAIL_HASH_SECRET: dev-only-change-me
      CORS_ORIGIN: http://localhost:3000
      OPENSEARCH_URL: http://opensearch:9200
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: "1025"
      PORT: 3001
      # Found missing while adding CANDIDATE_JWT_SECRET below (GitHub
      # issue #145) — without these, AdminAuthModule's env-var checks
      # throw synchronously at boot (Phase 18) and this profile's api
      # container has been unable to start since, for anyone who
      # actually tried `docker compose --profile full up`.
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD_HASH: '$2b$10$5d3GXDikXoI./2wvbNoUIeG2/aoU72AKnueOEYLMYOxoeL8vD5dlG'
      ADMIN_JWT_SECRET: dev-only-change-me-too
      COOKIE_SECURE: "false"
      CANDIDATE_JWT_SECRET: dev-only-change-me-candidate
      # GitHub issue #163 (Phase 19) — optional; empty ANTHROPIC_API_KEY
      # leaves AiModerationService's advisory triage disabled, unlike the
      # ADMIN_*/CANDIDATE_JWT_SECRET vars above which the app requires to
      # boot at all.
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_MODEL: claude-haiku-4-5
      # GitHub issues #439/#441 (Phase 39, D71) — the auto-approval layer
      # on top of the base triage above. Both default to disabled; empty
      # string is a safe "unset" for the threshold (GitHub issue #450 fixed
      # a bug where it wasn't). Set a real threshold and "true" here to
      # actually enable auto-approval once ANTHROPIC_API_KEY is real too.
      AI_MODERATION_AUTO_APPROVE_THRESHOLD: ""
      AI_AUTO_APPROVAL_ENABLED: "false"
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      mailpit:
        condition: service_started

  web:
    profiles: ["full"]
    build:
      context: ../web
      dockerfile: Dockerfile
      # Next.js inlines NEXT_PUBLIC_* vars into the client bundle at build
      # time — setting this under `environment:` below was a latent no-op
      # (found while building Phase 7's k8s manifests, GitHub issue #28):
      # the built image already had NEXT_PUBLIC_API_URL undefined baked in,
      # and only worked because web/src/lib/api.ts's fallback
      # ('http://localhost:3001') happened to match this profile's value.
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

  # Opt-in (GitHub issue #66, Phase 10) — local, free-tier practice for
  # AWS-shaped IAM/Secrets Manager integration, not part of the default
  # dev loop and not depended on by any actually-deployed code path (see
  # docs/DECISIONS.md D20). Scoped to just the two services this phase
  # needs, not LocalStack's full service catalog.
  localstack:
    profiles: ["localstack"]
    image: localstack/localstack:latest
    restart: unless-stopped
    environment:
      SERVICES: iam,secretsmanager
      # Read from the host shell — LocalStack now requires a free-tier
      # auth token just to start at all (a 2026 pricing/packaging change,
      # not specific to this project). Never hardcode a real token here.
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?Set LOCALSTACK_AUTH_TOKEN in your shell profile — see README.md}
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  opensearch_data:
  redpanda_data:
