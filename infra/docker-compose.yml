name: interview-insights

# Default (`docker compose up`): Postgres + OpenSearch. `api`/`web` run
# directly on the host via npm for the fast local-dev loop (see README.md)
# — no code talks to Redis/Kafka yet, so those aren't run either until
# something actually depends on them (docs/DECISIONS.md D9: avoid
# premature infrastructure). OpenSearch was added here for Phase 5 (GitHub
# issue #21) — the first real trigger, per that same D9 reasoning.
#
# `docker compose --profile full up --build`: also builds and runs `api`
# and `web` as containers, for prod-like local testing of the actual Docker
# images (GitHub issue #17) — migrations are applied automatically on
# container start (see api/Dockerfile's CMD).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interview_insights
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    profiles: ["full"]
    build:
      context: ../api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/interview_insights?schema=public
      EMAIL_HASH_SECRET: dev-only-change-me
      CORS_ORIGIN: http://localhost:3000
      OPENSEARCH_URL: http://opensearch:9200
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  web:
    profiles: ["full"]
    build:
      context: ../web
      dockerfile: Dockerfile
      # Next.js inlines NEXT_PUBLIC_* vars into the client bundle at build
      # time — setting this under `environment:` below was a latent no-op
      # (found while building Phase 7's k8s manifests, GitHub issue #28):
      # the built image already had NEXT_PUBLIC_API_URL undefined baked in,
      # and only worked because web/src/lib/api.ts's fallback
      # ('http://localhost:3001') happened to match this profile's value.
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  opensearch_data:
