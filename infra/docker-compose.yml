name: interview-insights

# Local dev: Postgres only. `api` and `web` run directly on the host via npm
# (see README.md) — no code talks to Redis/Kafka yet, so they aren't run
# until something actually depends on them (docs/DECISIONS.md D9: avoid
# premature infrastructure). Add them back here when Phase 3+ needs them.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interview_insights
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
