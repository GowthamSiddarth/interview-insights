# No env here — NEXT_PUBLIC_API_URL is a browser-side var Next.js inlines
# into the client bundle at *build* time (see web/Dockerfile), so it has to
# be set via --build-arg when the image is built, not as a Deployment env
# var. This image is built with NEXT_PUBLIC_API_URL=http://api.interview-
# insights.local to match 07-ingress.yaml's api host.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: interview-insights
spec:
  selector:
    app: web
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: interview-insights
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      # GitHub issue #805 (Phase 55) — matches the Dockerfile's own
      # `USER node` (uid/gid 1000 in node:22-slim).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: web
          image: interview-insights-web:k8s
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
