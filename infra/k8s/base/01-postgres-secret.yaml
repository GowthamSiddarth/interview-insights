# Plaintext is acceptable here — this targets local kind/minikube only.
# Real secret management (AWS Secrets Manager) is gated on a shared/staging
# environment existing, see docs/ROADMAP.md Phase 8b.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: interview-insights
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: interview_insights
