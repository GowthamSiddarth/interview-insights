# Phase 31 (D53), GitHub issue #334 — the first standalone microservice
# this project deploys. No Ingress: it has no public HTTP API of its own
# — /health is reachable in-cluster only, same as postgres/opensearch/
# redpanda. As of GitHub issue #335, this pod is a real Redpanda consumer
# (moderation.*.created.v1) with its own Postgres access (docs/DECISIONS.md
# D75) — REDPANDA_BROKERS/DATABASE_URL/MAIL_SMTP_* below mirror
# 05-api.yaml's/09-redpanda.yaml's own in-cluster Service DNS names.
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: interview-insights
data:
  PORT: "3002"
  REDPANDA_BROKERS: redpanda:9092
  MAIL_SMTP_HOST: mailpit
  MAIL_SMTP_PORT: "1025"
---
# Plaintext, same local-only reasoning as 01-postgres-secret.yaml/
# 05-api.yaml's api-secrets — not wired into the LocalStack secrets flow
# (docs/DECISIONS.md D74's own note: that move only happens once/if this
# value is ever rotated to something real, same standing as
# CANDIDATE_JWT_SECRET). EMAIL_ENCRYPTION_KEY must be the exact same
# value as api-secrets' own EMAIL_ENCRYPTION_KEY (GitHub issue #335,
# D74) — this service can only decrypt what api encrypted under it.
apiVersion: v1
kind: Secret
metadata:
  name: notification-service-secrets
  namespace: interview-insights
type: Opaque
stringData:
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/interview_insights?schema=public
  EMAIL_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: interview-insights
spec:
  selector:
    app: notification-service
  ports:
    - port: 3002
      targetPort: 3002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: interview-insights
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: interview-insights-notification-service:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: notification-service-config
            - secretRef:
                name: notification-service-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
