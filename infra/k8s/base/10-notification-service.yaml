# Phase 31 (D53), GitHub issue #334 — the first standalone microservice
# this project deploys. No Ingress: it has no public HTTP API of its own,
# at least until #335/#336 wire in a real Redpanda consumer — /health is
# reachable in-cluster only, same as postgres/opensearch/redpanda.
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: interview-insights
data:
  PORT: "3002"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: interview-insights
spec:
  selector:
    app: notification-service
  ports:
    - port: 3002
      targetPort: 3002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: interview-insights
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: interview-insights-notification-service:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: notification-service-config
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
