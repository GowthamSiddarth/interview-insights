# Mirrors infra/docker-compose.yml's redpanda service (image, single-node
# dev-container mode, command flags) — GitHub issue #330, D53. Headless
# Service (clusterIP: None) with a single replica, same as
# 04-opensearch.yaml: for a lone broker this makes the Service's own DNS
# name resolve straight to the one pod, so `--advertise-kafka-addr` can
# use the Service name unchanged from docker-compose's identical flag
# value — no per-environment templating needed. No consumer exists yet
# (that's GitHub issue #332); this is broker infra only, proven reachable.
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: interview-insights
spec:
  clusterIP: None
  selector:
    app: redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: admin
      port: 9644
      targetPort: 9644
    # The broker's own `external://` listener below (--kafka-addr /
    # --advertise-kafka-addr), meant for exactly this: `kubectl
    # port-forward svc/redpanda 19092:19092` from the host machine, the
    # same "localhost:19092" address docker-compose's own redpanda
    # service already exposes directly. Not used by any in-cluster
    # consumer — those all connect via the `kafka` port (9092) above,
    # using the Service's own DNS name.
    - name: kafka-external
      port: 19092
      targetPort: 19092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: interview-insights
spec:
  serviceName: redpanda
  replicas: 1
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
          # args (Docker CMD), not command (Docker ENTRYPOINT) — the image's
          # real entrypoint is /entrypoint.sh, which execs via rpk (the only
          # thing that understands --mode/--kafka-addr etc). command: here
          # would replace that entrypoint and invoke the raw seastar binary
          # directly, which doesn't recognize these flags at all.
          args:
            - redpanda
            - start
            - --mode
            - dev-container
            - --smp
            - "1"
            - --kafka-addr
            - internal://0.0.0.0:9092,external://0.0.0.0:19092
            - --advertise-kafka-addr
            - internal://redpanda:9092,external://localhost:19092
          ports:
            - containerPort: 9092
            - containerPort: 9644
            - containerPort: 19092
          volumeMounts:
            - name: redpanda-data
              mountPath: /var/lib/redpanda/data
          # Admin API's own readiness endpoint (verified locally: GET
          # /v1/status/ready returns {"status":"ready"} once the broker's
          # up) — same source of truth `rpk cluster health` reads from,
          # without needing an exec probe.
          readinessProbe:
            httpGet:
              path: /v1/status/ready
              port: 9644
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /v1/status/ready
              port: 9644
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: redpanda-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
