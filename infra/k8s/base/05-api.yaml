# Non-secret env for `api`. OPENSEARCH_URL/DATABASE_URL point at 03/04's
# in-cluster Service DNS names (short form resolves within the same
# namespace) — mirrors infra/docker-compose.yml's compose-network hostnames.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: interview-insights
data:
  PORT: "3001"
  OPENSEARCH_URL: http://opensearch:9200
  CORS_ORIGIN: http://app.interview-insights.local
  # Explicit, not inferred from NODE_ENV — see admin-auth.controller.ts's
  # comment for why. Every overlay today (dev, dev-localstack, staging,
  # prod placeholders) is plain HTTP with no TLS termination, so this
  # stays "false" everywhere until a real HTTPS-fronted environment exists.
  COOKIE_SECURE: "false"
  # Not sensitive on its own (a single shared admin *username*, not the
  # credential) — GitHub issue #159, Phase 18.
  ADMIN_USERNAME: admin
  # In-cluster Service DNS name for 08-mailpit.yaml (GitHub issue #144,
  # Phase 16) — mirrors OPENSEARCH_URL's pattern above. No consumer wires
  # MailService in yet (that's issue #145), so this is currently unused,
  # but added now rather than left as a gap for #145 to rediscover: the
  # api pod has no other way to reach `mailpit` by name once it does.
  MAIL_SMTP_HOST: mailpit
  MAIL_SMTP_PORT: "1025"
---
# Plaintext, same local-only reasoning as 01-postgres-secret.yaml.
# DATABASE_URL duplicates 01-postgres-secret.yaml's credentials as a single
# connection string — Kubernetes has no native way to compose one env var
# out of several Secret keys, and a wrapper entrypoint script just to avoid
# this duplication isn't worth it at local-dev scale.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: interview-insights
type: Opaque
stringData:
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/interview_insights?schema=public
  EMAIL_HASH_SECRET: dev-only-change-me
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: interview-insights
spec:
  selector:
    app: api
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: interview-insights
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: interview-insights-api:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secrets
            # ADMIN_PASSWORD_HASH/ADMIN_JWT_SECRET live here, deliberately
            # NOT in api-secrets above (GitHub issue #192) — this whole file
            # is checked into git, and a "real" rotated credential committed
            # to it would be exactly as public as the dev-only placeholder
            # it replaced. admin-credentials is instead provisioned
            # imperatively from GitHub Actions repo secrets, same pattern as
            # localstack-credentials/LOCALSTACK_AUTH_TOKEN (D23) — see
            # cd.yml's "Provision admin credentials secret" step and
            # infra/scripts/bootstrap-kind.sh, both of which must run before
            # this Deployment's pod is created (envFrom doesn't hot-reload).
            - secretRef:
                name: admin-credentials
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
