# Non-secret env for `api`. OPENSEARCH_URL/DATABASE_URL point at 03/04's
# in-cluster Service DNS names (short form resolves within the same
# namespace) — mirrors infra/docker-compose.yml's compose-network hostnames.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: interview-insights
data:
  PORT: "3001"
  OPENSEARCH_URL: http://opensearch:9200
  CORS_ORIGIN: http://app.interview-insights.local
  # Explicit, not inferred from NODE_ENV — see admin-auth.controller.ts's
  # comment for why. Every overlay today (dev, staging, prod placeholders)
  # is plain HTTP with no TLS termination, so this stays "false"
  # everywhere until a real HTTPS-fronted environment exists.
  COOKIE_SECURE: "false"
  # web/api are served from genuinely different hostnames in every
  # deployed environment (app.* vs api.*), so a host-only session cookie
  # set by api's response is invisible to web's own JS — this is what
  # broke the candidate_logged_in hint cookie's NavBar check the moment
  # anyone used the real Ingress-fronted app instead of local dev servers.
  # Widens every session cookie (admin, candidate, hint) to the shared
  # parent domain instead. staging/prod patch this to their own per-
  # environment parent domain (see those overlays' kustomization.yaml).
  COOKIE_DOMAIN: .interview-insights.local
  # Not sensitive on its own (a single shared admin *username*, not the
  # credential) — GitHub issue #159, Phase 18.
  ADMIN_USERNAME: admin
  # In-cluster Service DNS name for 08-mailpit.yaml (GitHub issue #144,
  # Phase 16) — mirrors OPENSEARCH_URL's pattern above. No consumer wires
  # MailService in yet (that's issue #145), so this is currently unused,
  # but added now rather than left as a gap for #145 to rediscover: the
  # api pod has no other way to reach `mailpit` by name once it does.
  MAIL_SMTP_HOST: mailpit
  MAIL_SMTP_PORT: "1025"
  # Not sensitive — which Claude model AiModerationService calls (GitHub
  # issue #163, Phase 19). Only takes effect once ANTHROPIC_API_KEY (below,
  # in anthropic-credentials) is actually set; the feature is a no-op
  # advisory triage otherwise, never a hard requirement to boot.
  ANTHROPIC_MODEL: claude-haiku-4-5
  # GitHub issues #439/#441 (Phase 39, D71) — the auto-approval layer on
  # top of the base triage above. Both default to disabled; empty string
  # is a safe "unset" for the threshold (GitHub issue #450 fixed a bug
  # where it wasn't — Number('') is 0, not NaN, which silently made every
  # clean verdict eligible). Not sensitive — same reasoning as
  # ANTHROPIC_MODEL — but wiki/deployment-guide.md section 5c documents
  # actually turning this on since it also requires a real
  # ANTHROPIC_API_KEY (anthropic-credentials Secret, below).
  AI_MODERATION_AUTO_APPROVE_THRESHOLD: ""
  AI_AUTO_APPROVAL_ENABLED: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: interview-insights
spec:
  selector:
    app: api
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: interview-insights
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: interview-insights-api:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: api-config
            # DATABASE_URL/EMAIL_HASH_SECRET/EMAIL_ENCRYPTION_KEY/
            # CANDIDATE_JWT_SECRET all come from LocalStack Secrets
            # Manager at boot (api/src/secrets/localstack-secrets-
            # bootstrap.ts, this overlay's api-config-patch.yaml) — no
            # committed Secret for them exists anymore (GitHub issue
            # #466, D76): a plaintext k8s Secret carrying a "dev-only,
            # change-me" fallback for four real credentials is exactly
            # what CLAUDE.md's hard constraint #6 forbids.
            #
            # ADMIN_PASSWORD_HASH/ADMIN_JWT_SECRET below were never in a
            # committed Secret to begin with (GitHub issue #192) — this
            # whole file is checked into git, and a "real" rotated
            # credential committed to it would be exactly as public as
            # the dev-only placeholder it replaced. admin-credentials is
            # instead provisioned imperatively from GitHub Actions repo
            # secrets, same pattern as localstack-credentials/
            # LOCALSTACK_AUTH_TOKEN (D23, now also postgres-credentials,
            # D77) — see cd.yml's "Provision admin credentials secret"
            # step and infra/scripts/bootstrap-kind.sh, both of which
            # must run before this Deployment's pod is created (envFrom
            # doesn't hot-reload).
            - secretRef:
                name: admin-credentials
            # GitHub issue #163 (Phase 19) — same imperative-provisioning
            # pattern as admin-credentials/localstack-credentials above,
            # but genuinely optional: an empty ANTHROPIC_API_KEY (the
            # default whenever nobody has supplied a real one) just leaves
            # AiModerationService's advisory triage disabled — nothing
            # else depends on this Secret existing or being non-empty. See
            # cd.yml's "Provision AI moderation secret" step and
            # infra/scripts/bootstrap-kind.sh.
            - secretRef:
                name: anthropic-credentials
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
