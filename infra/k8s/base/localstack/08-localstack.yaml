# Opt-in (GitHub issue #78, Phase 11) — NOT in kustomization.yaml's
# resources list, so it's never part of the default `dev` overlay's
# baseline deploy (same "don't force premature infra into the default
# path" reasoning as docs/DECISIONS.md D9/D20). Apply via
# infra/k8s/overlays/dev-localstack instead, which composes `../dev` with
# this one extra manifest. Scoped to just IAM + Secrets Manager, matching
# infra/docker-compose.yml's existing `localstack` profile (GitHub issue
# #66, Phase 10) — that profile stays the fast/no-cluster way to exercise
# the same two services; this is the in-cluster equivalent so `api`'s pod
# can actually reach it.
#
# LocalStack now requires a free-tier auth token just to start (see
# infra/docker-compose.yml's comment) — never committed here. Before
# applying this overlay, create the Secret out-of-band:
#   kubectl create secret generic localstack-credentials \
#     --namespace interview-insights \
#     --from-literal=LOCALSTACK_AUTH_TOKEN="$LOCALSTACK_AUTH_TOKEN"
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: interview-insights
spec:
  selector:
    app: localstack
  ports:
    - port: 4566
      targetPort: 4566
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: interview-insights
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:latest
          ports:
            - containerPort: 4566
          env:
            - name: SERVICES
              value: iam,secretsmanager
            - name: LOCALSTACK_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: localstack-credentials
                  key: LOCALSTACK_AUTH_TOKEN
          # No PVC — this is a practice/prototype tool, not a source of
          # truth (unlike postgres/opensearch's StatefulSets); losing its
          # state on pod restart just means re-running the seed step.
          volumeMounts:
            - name: localstack-data
              mountPath: /var/lib/localstack
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: localstack-data
          emptyDir: {}
