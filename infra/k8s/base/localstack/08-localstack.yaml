# NOT in base/kustomization.yaml's resources list — only
# infra/k8s/overlays/dev composes `../../base` with this extra manifest,
# so a direct `kubectl apply -k infra/k8s/base` never picks this up.
# `dev` requiring LocalStack was originally opt-in via a separate
# `dev-localstack` overlay (GitHub issue #78); GitHub issue #99
# (docs/DECISIONS.md D23) made it .github/workflows/cd.yml's actual
# deploy target, and GitHub issue #466 (D76) later folded that overlay
# into `dev` itself, unconditionally — `dev` now always requires
# LocalStack, no separate variant left. Scoped to just IAM + Secrets
# Manager, matching infra/docker-compose.yml's existing `localstack`
# profile (GitHub issue #66, Phase 10) — that profile stays the
# fast/no-cluster way to exercise the same two services; this is the
# in-cluster equivalent so `api`'s/`notification-service`'s pods can
# actually reach it.
#
# LocalStack now requires a free-tier auth token just to start (see
# infra/docker-compose.yml's comment) — never committed here. CD
# provisions the Secret itself from the LOCALSTACK_AUTH_TOKEN repo
# secret; for a manual apply, create it out-of-band first:
#   kubectl create secret generic localstack-credentials \
#     --namespace interview-insights \
#     --from-literal=LOCALSTACK_AUTH_TOKEN="$LOCALSTACK_AUTH_TOKEN"
#
# ADMIN_PASSWORD_HASH/ADMIN_JWT_SECRET/ANTHROPIC_API_KEY below (GitHub
# issue #466's own follow-up, D78) exist here for exactly one reason:
# init/seed.sh (mounted below) needs the *real* values to seed Secrets
# Manager with on every LocalStack start, including an unplanned
# restart — it can't hardcode a committed placeholder the way it does
# for e.g. EMAIL_HASH_SECRET, because ADMIN_PASSWORD_HASH/
# ADMIN_JWT_SECRET deliberately never have one (same reasoning
# admin-auth.env.ts's own comment gives). Same admin-credentials/
# anthropic-credentials Secrets `api` used to read directly — those
# entries were removed from api's own Deployment (05-api.yaml) once api
# started fetching these from Secrets Manager instead; LocalStack's pod
# is now the only consumer of them as k8s Secrets.
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: interview-insights
spec:
  selector:
    app: localstack
  ports:
    - port: 4566
      targetPort: 4566
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: interview-insights
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:latest
          ports:
            - containerPort: 4566
          env:
            - name: SERVICES
              value: iam,secretsmanager
            - name: LOCALSTACK_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: localstack-credentials
                  key: LOCALSTACK_AUTH_TOKEN
            - name: ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: admin-credentials
                  key: ADMIN_PASSWORD_HASH
            - name: ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: admin-credentials
                  key: ADMIN_JWT_SECRET
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-credentials
                  key: ANTHROPIC_API_KEY
          # No PVC — this is a practice/prototype tool, not a source of
          # truth (unlike postgres/opensearch's StatefulSets); losing its
          # state on pod restart is expected. The init-hook mount below
          # (not a PVC) is what actually recovers from that automatically.
          volumeMounts:
            - name: localstack-data
              mountPath: /var/lib/localstack
            # LocalStack's init-hook mechanism: any script under
            # /etc/localstack/init/ready.d/ runs automatically every time
            # LocalStack finishes starting, including after an unplanned
            # restart — see kustomization.yaml + init/seed.sh's own
            # comments for why this exists instead of a PVC.
            - name: localstack-init-seed
              mountPath: /etc/localstack/init/ready.d
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: localstack-data
          emptyDir: {}
        - name: localstack-init-seed
          configMap:
            name: localstack-init-seed
            defaultMode: 0755
