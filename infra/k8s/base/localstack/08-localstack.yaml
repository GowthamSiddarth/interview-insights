# NOT in base/kustomization.yaml's resources list — only
# infra/k8s/overlays/dev-localstack composes `../dev` with this extra
# manifest, so a direct `kubectl apply -k infra/k8s/base` (or the plain
# `dev` overlay) never picks this up. As of GitHub issue #99
# (docs/DECISIONS.md D23), dev-localstack is .github/workflows/cd.yml's
# actual deploy target — this isn't a rarely-touched side path anymore,
# every automatic redeploy applies it. Scoped to just IAM + Secrets
# Manager, matching infra/docker-compose.yml's existing `localstack`
# profile (GitHub issue #66, Phase 10) — that profile stays the
# fast/no-cluster way to exercise the same two services; this is the
# in-cluster equivalent so `api`'s pod can actually reach it.
#
# LocalStack now requires a free-tier auth token just to start (see
# infra/docker-compose.yml's comment) — never committed here. CD
# provisions the Secret itself from the LOCALSTACK_AUTH_TOKEN repo
# secret; for a manual apply, create it out-of-band first:
#   kubectl create secret generic localstack-credentials \
#     --namespace interview-insights \
#     --from-literal=LOCALSTACK_AUTH_TOKEN="$LOCALSTACK_AUTH_TOKEN"
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: interview-insights
spec:
  selector:
    app: localstack
  ports:
    - port: 4566
      targetPort: 4566
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: interview-insights
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:latest
          ports:
            - containerPort: 4566
          env:
            - name: SERVICES
              value: iam,secretsmanager
            - name: LOCALSTACK_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: localstack-credentials
                  key: LOCALSTACK_AUTH_TOKEN
          # No PVC — this is a practice/prototype tool, not a source of
          # truth (unlike postgres/opensearch's StatefulSets); losing its
          # state on pod restart just means re-running the seed step.
          volumeMounts:
            - name: localstack-data
              mountPath: /var/lib/localstack
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: localstack-data
          emptyDir: {}
