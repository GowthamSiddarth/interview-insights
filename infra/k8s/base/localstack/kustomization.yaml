# A nested base, not a flat file reference — Kustomize's load restrictor
# blocks a raw (non-kustomization) YAML file being referenced from outside
# its own kustomization root, even one level up via `../../`. Wrapping
# 08-localstack.yaml in its own kustomization.yaml makes it a proper base
# directory, which overlays are always allowed to reference regardless of
# location (same reason infra/k8s/overlays/dev already references
# ../../base directly).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 08-localstack.yaml's own resources already hardcode this namespace, so
# this is a no-op for them — it's here because configMapGenerator's output
# doesn't inherit a namespace any other way, and without it the generated
# ConfigMap silently lands in `default` instead (caught by testing this
# against the real cluster: the Deployment's volume mount failed with
# "configmap ... not found" because kubectl had applied it into the
# wrong namespace).
namespace: interview-insights

resources:
  - 08-localstack.yaml

# init/seed.sh gets mounted into the LocalStack container at
# /etc/localstack/init/ready.d/ so it self-reseeds automatically on every
# restart, not just when a human/CI runs infra/aws/seed-localstack.sh.
# disableNameSuffixHash: without the content-hash suffix, the ConfigMap's
# name in 08-localstack.yaml's volume reference stays stable across edits
# to the script (Kustomize would otherwise force updating both files
# together every time the script changes, same reasoning as this
# project's other config generation).
configMapGenerator:
  - name: localstack-init-seed
    files:
      - init/seed.sh
    options:
      disableNameSuffixHash: true
