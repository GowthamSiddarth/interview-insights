# GitHub issue #662 (Phase 46) — Let's Encrypt's staging ACME server.
# Certificates issued here are NOT trusted by real clients (test CA) —
# this exists purely to verify the HTTP-01 challenge flow end to end
# (DNS -> firewall -> ingress-nginx routing) without touching
# production's real rate limits (50 certs/registered domain/week).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: gothsiddu@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
