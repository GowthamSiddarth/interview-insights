name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interview_insights_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # GitHub issue #144, Phase 16 — mail.e2e-spec.ts needs a real
      # instance, not a mock. No documented /healthz-style endpoint (see
      # docs/DECISIONS.md D29), so the health check uses the image's own
      # busybox wget against the web UI root path instead of guessing an
      # API path that might not exist.
      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget --spider -q http://localhost:8025/ || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interview_insights_test?schema=public
      OPENSEARCH_URL: http://localhost:9200
      MAIL_SMTP_HOST: localhost
      MAIL_SMTP_PORT: "1025"
      MAIL_HTTP_URL: http://localhost:8025
      EMAIL_HASH_SECRET: ci-test-secret
      # bcrypt("dev-only-admin-password") — see api/test/support/admin-session.ts,
      # which every moderation-touching e2e spec logs in with (GitHub issue #159).
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD_HASH: '$2b$10$5d3GXDikXoI./2wvbNoUIeG2/aoU72AKnueOEYLMYOxoeL8vD5dlG'
      ADMIN_JWT_SECRET: ci-test-jwt-secret
      CANDIDATE_JWT_SECRET: ci-test-candidate-jwt-secret
      CORS_ORIGIN: http://localhost:3000
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Apply migrations to test database
        run: npx prisma migrate deploy
      - run: npm run test:e2e

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  workers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  # Build-only validation (GitHub-hosted, no cluster or self-hosted runner
  # needed) - GitHub issue #106. Without this, a broken Kustomize overlay
  # or a broken Dockerfile merges with a green CI check and only fails
  # later, when the self-hosted runner's real CD job tries to build/apply
  # it against the live kind cluster.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'
      - name: Validate Kustomize overlays build cleanly
        run: |
          for overlay in dev dev-localstack staging prod; do
            echo "== infra/k8s/overlays/$overlay =="
            kubectl kustomize "infra/k8s/overlays/$overlay" > /dev/null
          done
      - name: Build api image (validation only, no push/run)
        run: docker build -t interview-insights-api:ci-check -f api/Dockerfile api
      - name: Build web image (validation only, no push/run)
        run: |
          docker build -t interview-insights-web:ci-check -f web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=http://api.interview-insights.local web
