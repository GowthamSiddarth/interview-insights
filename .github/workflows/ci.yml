name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interview_insights_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # GitHub issue #144, Phase 16 — mail.e2e-spec.ts needs a real
      # instance, not a mock. No documented /healthz-style endpoint (see
      # docs/DECISIONS.md D29), so the health check uses the image's own
      # busybox wget against the web UI root path instead of guessing an
      # API path that might not exist.
      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget --spider -q http://localhost:8025/ || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # GitHub issue #332, Phase 30 (D53) — domain-events.e2e-spec.ts
      # needs a real broker, not a mock, same D29 standing as mailpit
      # above. GitHub Actions service containers can't override a
      # container's default command, so this runs Redpanda's own
      # plain default CMD (`redpanda start --overprovisioned`) rather
      # than infra/docker-compose.yml's `dev-container`-mode flags —
      # verified locally to work identically for a single-broker,
      # default-listener (9092/9644) setup like this one.
      redpanda:
        image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
        ports:
          - 9092:9092
          - 9644:9644
        options: >-
          --health-cmd "rpk cluster health | grep -q 'Healthy:.*true'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interview_insights_test?schema=public
      OPENSEARCH_URL: http://localhost:9200
      MAIL_SMTP_HOST: localhost
      MAIL_SMTP_PORT: "1025"
      MAIL_HTTP_URL: http://localhost:8025
      REDPANDA_BROKERS: localhost:9092
      EMAIL_HASH_SECRET: ci-test-secret
      # GitHub issue #335, D74 — 32-byte AES-256 key, hex-encoded (64 hex
      # chars). Must match notification-service's own value below so it
      # can decrypt what api encrypts.
      EMAIL_ENCRYPTION_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
      # bcrypt("dev-only-admin-password") — see api/test/support/admin-session.ts,
      # which every moderation-touching e2e spec logs in with (GitHub issue #159).
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD_HASH: '$2b$10$5d3GXDikXoI./2wvbNoUIeG2/aoU72AKnueOEYLMYOxoeL8vD5dlG'
      ADMIN_JWT_SECRET: ci-test-jwt-secret
      # Non-sensitive, same tier as ADMIN_USERNAME — GitHub issue #485,
      # Phase 36. AdminAuthService.onModuleInit now fails fast at boot
      # without it.
      ADMIN_EMAIL: admin@interview-insights.local
      CANDIDATE_JWT_SECRET: ci-test-candidate-jwt-secret
      CORS_ORIGIN: http://localhost:3000
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Apply migrations to test database
        run: npx prisma migrate deploy
      - run: npm run test:e2e

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  workers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  notification-service:
    runs-on: ubuntu-latest
    services:
      # GitHub issue #335 — this service's own Postgres access
      # (docs/DECISIONS.md D75). A separate, ephemeral container from the
      # `api` job's — no shared state, so reusing the same DB/user name is
      # fine (same reasoning `api`'s own service containers already rely on).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interview_insights_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Same "no consumer, no test" standing as api's own mailpit service
      # (D29) — test/notifications.e2e-spec.ts needs a real inbox to
      # confirm the pending-review email actually lands, not a mock.
      mailpit:
        image: axllent/mailpit:v1.21
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd "wget --spider -q http://localhost:8025/ || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Same reasoning as api's own redpanda service (GitHub issue #332)
      # — this is the first real *consumer*, so its own e2e test needs a
      # real broker to subscribe to and a real producer to publish onto,
      # not a mock of either side.
      redpanda:
        image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
        ports:
          - 9092:9092
          - 9644:9644
        options: >-
          --health-cmd "rpk cluster health | grep -q 'Healthy:.*true'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interview_insights_test?schema=public
      MAIL_SMTP_HOST: localhost
      MAIL_SMTP_PORT: "1025"
      MAIL_HTTP_URL: http://localhost:8025
      REDPANDA_BROKERS: localhost:9092
      # Must match the api job's own EMAIL_ENCRYPTION_KEY — same
      # reasoning as infra/k8s/base's two Secrets, D74.
      EMAIL_ENCRYPTION_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
    defaults:
      run:
        working-directory: services/notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/notification-service/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # No `prisma migrate deploy` here (docs/DECISIONS.md D75) — api's
      # own job below applies every migration, including
      # notification_log/candidates.email_encrypted, to the same
      # DATABASE_URL this job's Postgres would use; this job instead
      # applies api's migrations directly against its own throwaway
      # database so it stays runnable in complete isolation from the api
      # job (each job gets its own ephemeral service containers).
      - name: Apply api's migrations (this service's own schema source of truth, D75)
        working-directory: api
        run: |
          npm ci
          npx prisma migrate deploy
      - run: npm run test:e2e

  review-analyzer:
    runs-on: ubuntu-latest
    services:
      # GitHub issue #339 (Phase 32, D53) — this service's own real broker
      # for analysis.e2e-spec.ts, same "needs a real instance, not a mock"
      # reasoning as the notification-service job's redpanda service above.
      # GitHub issue #340 (D81) added its own Postgres too, same
      # read-only-Prisma-schema pattern as notification-service's own job —
      # no mailpit here, this service still never sends email.
      redpanda:
        image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
        ports:
          - 9092:9092
          - 9644:9644
        options: >-
          --health-cmd "rpk cluster health | grep -q 'Healthy:.*true'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interview_insights_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/interview_insights_test?schema=public
      REDPANDA_BROKERS: localhost:9092
    defaults:
      run:
        working-directory: services/review-analyzer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/review-analyzer/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - run: npm test
      # No `prisma migrate deploy` here (docs/DECISIONS.md D75) — same
      # reasoning as the notification-service job above: api's migrations
      # are this project's one schema source of truth, applied against
      # this job's own throwaway database so it stays runnable in complete
      # isolation from the api job.
      - name: Apply api's migrations (this service's own schema source of truth, D75)
        working-directory: api
        run: |
          npm ci
          npx prisma migrate deploy
      - run: npm run test:e2e

  # Build-only validation (GitHub-hosted, no cluster or self-hosted runner
  # needed) - GitHub issue #106. Without this, a broken Kustomize overlay
  # or a broken Dockerfile merges with a green CI check and only fails
  # later, when the self-hosted runner's real CD job tries to build/apply
  # it against the live kind cluster.
  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.31.0'
      - name: Validate Kustomize overlays build cleanly
        # dev-localstack no longer exists as its own overlay (GitHub
        # issue #466, D76) — its LocalStack resource + patches were
        # folded into `dev` itself, which now requires LocalStack
        # unconditionally.
        run: |
          for overlay in dev staging prod; do
            echo "== infra/k8s/overlays/$overlay =="
            kubectl kustomize "infra/k8s/overlays/$overlay" > /dev/null
          done
      - name: Build api image (validation only, no push/run)
        run: docker build -t interview-insights-api:ci-check -f api/Dockerfile api
      - name: Build web image (validation only, no push/run)
        run: |
          docker build -t interview-insights-web:ci-check -f web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=http://api.interview-insights.local web
      - name: Build notification-service image (validation only, no push/run)
        run: |
          docker build -t interview-insights-notification-service:ci-check \
            -f services/notification-service/Dockerfile services/notification-service
      - name: Build review-analyzer image (validation only, no push/run)
        run: |
          docker build -t interview-insights-review-analyzer:ci-check \
            -f services/review-analyzer/Dockerfile services/review-analyzer
