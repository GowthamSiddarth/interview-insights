name: CD

# Real, automatic trigger (user's explicit decision, Phase 12) — not
# workflow_dispatch. Combined with the self-hosted runner being on-demand
# (issue #88), a push to main just queues this job until the runner is
# next started with `./run.sh` — reconciling "real" CD semantics with
# deliberate, session-scoped execution on a personal machine. Only
# triggers on changes that actually affect what's deployed; docs/blog-only
# merges don't queue a rebuild.
#
# Targets infra/k8s/overlays/dev (GitHub issue #99, docs/DECISIONS.md
# D23; #99's original "dev-localstack, not plain dev" distinction was
# folded away by GitHub issue #466/D76 — `dev` itself now requires
# LocalStack, no separate variant overlay left) — every redeploy backs
# api's/notification-service's/review-analyzer's secrets with LocalStack
# Secrets Manager/IAM via an assumed role each, reseeded fresh each run
# since LocalStack keeps no state across pod restarts. Requires the
# LOCALSTACK_AUTH_TOKEN repo secret to be set (`gh secret set
# LOCALSTACK_AUTH_TOKEN`) — a one-time manual step, since the token itself
# can't be provisioned by this workflow. Also requires ADMIN_PASSWORD_HASH,
# ADMIN_JWT_SECRET, and (GitHub issue #466/D77) POSTGRES_PASSWORD repo
# secrets (`gh secret set ADMIN_PASSWORD_HASH` / `gh secret set
# ADMIN_JWT_SECRET` / `gh secret set POSTGRES_PASSWORD`) — real
# credentials, never committed to a manifest. ANTHROPIC_API_KEY (GitHub
# issue #163, now read by review-analyzer per GitHub issue #340/D81) is
# optional — an unset repo secret just deploys with AI moderation triage
# disabled.
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'web/**'
      - 'services/notification-service/**'
      - 'services/review-analyzer/**'
      - 'infra/k8s/**'

# A second push while an earlier deploy is still queued/running should
# win outright — only the latest main matters for a single local cluster.
concurrency:
  group: cd
  cancel-in-progress: true

jobs:
  deploy:
    # Explicit labels, not bare "self-hosted" (Phase 40, GitHub issue #504)
    # — this job needs the local kind cluster/kubectl access that only the
    # Phase 12 macOS runner has. A second self-hosted runner pool exists
    # now (the Oracle CI VM, labeled self-hosted,linux,ARM64,oracle-ci) —
    # without this, GitHub could route this job to whichever runner grabs
    # it first, and the Oracle VM has no kind cluster to deploy to.
    runs-on: [self-hosted, macOS, local-kind]
    env:
      # GitHub issue #540 (D89/D90) — this runner's `interview-insights`
      # kind cluster is now created via `KIND_EXPERIMENTAL_PROVIDER=podman`
      # (infra/scripts/bootstrap-kind.sh). `kind`'s own docs mark the
      # podman provider experimental, not GA, same caveat D84/#539
      # already flagged — every `kind`-touching step below needs this set
      # to talk to that cluster correctly.
      KIND_EXPERIMENTAL_PROVIDER: podman
    steps:
      - uses: actions/checkout@v4

      # D35/D43/GitHub issue #530 all trace the same failure back to disk
      # pressure on this persistent runner, discovered previously only
      # several steps downstream (a confusing OpenSearch
      # cluster_block_exception during "Roll out api"). This gate moves
      # that discovery to the first real step, with an actionable message,
      # instead of a stack trace several minutes later (GitHub issue #531).
      # Auto-remediation lives in infra/scripts/disk-health-check.sh
      # (issue #532), not here — this step only fails fast.
      - name: Pre-flight disk usage gate
        run: |
          USAGE=$(df -P / | awk 'NR==2 { gsub("%", "", $5); print $5 }')
          echo "host disk usage: ${USAGE}%"
          if [ "$USAGE" -ge 85 ]; then
            echo "::error::Disk at ${USAGE}% (>= 85%) - prune before deploying. See wiki/deployment-guide.md section 11.4, or run infra/scripts/disk-health-check.sh run."
            exit 1
          fi

      - name: Build api image
        run: |
          podman build -t interview-insights-api:k8s -f api/Dockerfile \
            --build-arg GIT_SHA=$(git rev-parse --short HEAD) api

      - name: Build web image
        run: |
          podman build -t interview-insights-web:k8s -f web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=http://api.interview-insights.local web

      - name: Build notification-service image
        # Phase 31 (D53), GitHub issue #334 — first standalone microservice.
        run: |
          podman build -t interview-insights-notification-service:k8s \
            -f services/notification-service/Dockerfile \
            --build-arg GIT_SHA=$(git rev-parse --short HEAD) services/notification-service

      - name: Build review-analyzer image
        # Phase 32 (D53), GitHub issue #339 — second standalone microservice.
        run: |
          podman build -t interview-insights-review-analyzer:k8s \
            -f services/review-analyzer/Dockerfile \
            --build-arg GIT_SHA=$(git rev-parse --short HEAD) services/review-analyzer

      - name: Load images into kind
        # `kind load docker-image` doesn't work against a podman-built
        # image (fails on a `localhost/`-prefix naming mismatch, per
        # D88/#545) even against a podman-provider cluster — `podman save
        # | kind load image-archive` is the workaround D88/D89 verified.
        #
        # GitHub issue #540 (D91): that workaround alone still isn't
        # enough for a real Deployment. Podman canonicalizes any locally
        # built, unqualified image as `localhost/<name>:<tag>`, and
        # `podman save`/`kind load image-archive` preserves that name
        # verbatim inside the node's containerd store. Every manifest in
        # this repo references the bare name (`interview-insights-api:k8s`,
        # no prefix) — containerd's own short-name resolution expands a
        # bare reference to `docker.io/library/<name>:<tag>`, not
        # `localhost/<name>:<tag>`, so it never matches the loaded image
        # and kubelet attempts a real Docker Hub pull instead (which
        # 401s: `ImagePullBackOff`/`pull access denied`). Explicitly
        # re-tagging under `docker.io/library/` before saving makes the
        # embedded name match what kubelet's bare-reference resolution
        # actually looks up, so it's found in the node's local store
        # instead of triggering a pull. Verified end to end against the
        # real `infra/k8s/overlays/dev` Deployments, not just a synthetic
        # pod (D88/D89's own verification never re-created this exact
        # bare-reference path).
        run: |
          for img in interview-insights-api:k8s interview-insights-web:k8s \
            interview-insights-notification-service:k8s interview-insights-review-analyzer:k8s; do
            podman tag "$img" "docker.io/library/$img"
            podman save "docker.io/library/$img" | kind load image-archive /dev/stdin --name interview-insights
          done

      - name: Ensure namespace exists
        run: kubectl apply -f infra/k8s/base/00-namespace.yaml

      - name: Provision admin credentials secret
        # Must land before api's Deployment (created by the overlay apply
        # below) picks up its envFrom — same "doesn't hot-reload" ordering
        # requirement as the LocalStack step right after this one. Real
        # rotated values (GitHub issue #192) live only as repo secrets —
        # never in a git-tracked manifest, see 05-api.yaml's own comment.
        env:
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
        run: |
          kubectl create secret generic admin-credentials \
            --namespace interview-insights \
            --from-literal=ADMIN_PASSWORD_HASH="$ADMIN_PASSWORD_HASH" \
            --from-literal=ADMIN_JWT_SECRET="$ADMIN_JWT_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Provision Postgres credentials secret
        # GitHub issue #466, D77 — same imperative-provisioning pattern
        # as admin-credentials above, applied to Postgres's own
        # credential: Postgres needs it before any of our app code
        # exists to fetch one from Secrets Manager, so the LocalStack-
        # at-boot pattern used for api's/notification-service's own
        # secrets doesn't apply here. Must land before 03-postgres.yaml's
        # StatefulSet (created by the overlay apply below) picks up its
        # envFrom — same ordering requirement as admin-credentials.
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          kubectl create secret generic postgres-credentials \
            --namespace interview-insights \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Provision AI moderation secret
        # Genuinely optional (GitHub issue #163) — an empty
        # ANTHROPIC_API_KEY just leaves review-analyzer's advisory triage
        # disabled (GitHub issue #340 moved this from api's own
        # AiModerationService, D81); nothing else depends on this secret
        # existing. Real values would come from an ANTHROPIC_API_KEY repo
        # secret (`gh secret set ANTHROPIC_API_KEY`), same never-committed
        # pattern as ADMIN_PASSWORD_HASH/ADMIN_JWT_SECRET above.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          kubectl create secret generic anthropic-credentials \
            --namespace interview-insights \
            --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Provision LocalStack auth token secret
        # Must land before the overlay below creates the LocalStack pod —
        # same order as the manual walkthrough (wiki/deployment-guide.md
        # section 5): the Deployment reads this via secretKeyRef, which
        # doesn't hot-reload, so if the Secret didn't exist yet at pod
        # creation the pod would need a manual restart to pick it up.
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          kubectl create secret generic localstack-credentials \
            --namespace interview-insights \
            --from-literal=LOCALSTACK_AUTH_TOKEN="$LOCALSTACK_AUTH_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply the dev overlay
        run: kubectl apply -k infra/k8s/overlays/dev

      - name: Wait for LocalStack
        run: kubectl wait --for=condition=ready pod -l app=localstack -n interview-insights --timeout=120s

      - name: Seed LocalStack secrets + IAM
        # POSTGRES_PASSWORD must match the postgres-credentials Secret
        # provisioned above (GitHub issue #466, D77) — seed-localstack.sh
        # embeds it into the seeded database-url secret's connection
        # string, otherwise api/notification-service would fetch a
        # DATABASE_URL whose password doesn't match Postgres's actual one.
        # ADMIN_PASSWORD_HASH/ADMIN_JWT_SECRET/ANTHROPIC_API_KEY (GitHub
        # issue #466's own follow-up, D78) are required here too --
        # seed-localstack.sh seeds Secrets Manager with these directly on
        # every run (the actual mechanism that keeps them current, not
        # LocalStack's own pod restarting -- that only matters for
        # surviving an *unplanned* restart between deploys, via the
        # init-hook). Job steps don't share env with each other by
        # default, so these have to be passed through explicitly even
        # though earlier steps already read them from the same secrets.
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          kubectl -n interview-insights port-forward svc/localstack 4566:4566 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 15); do
            curl -sf http://localhost:4566/_localstack/health > /dev/null && break
            sleep 2
          done
          ./infra/aws/seed-localstack.sh

      - name: Roll out api
        run: |
          kubectl -n interview-insights rollout restart deployment/api
          kubectl -n interview-insights rollout status deployment/api --timeout=90s

      - name: Roll out web
        run: |
          kubectl -n interview-insights rollout restart deployment/web
          kubectl -n interview-insights rollout status deployment/web --timeout=90s

      - name: Roll out notification-service
        run: |
          kubectl -n interview-insights rollout restart deployment/notification-service
          kubectl -n interview-insights rollout status deployment/notification-service --timeout=90s

      - name: Roll out review-analyzer
        run: |
          kubectl -n interview-insights rollout restart deployment/review-analyzer
          kubectl -n interview-insights rollout status deployment/review-analyzer --timeout=90s

      # Every run's "Build api/web image" step leaves the previous build's
      # now-untagged layers behind — `kind load image-archive` re-tags the
      # new one but never removes the old. On a persistent self-hosted
      # runner (issue #88 — this box, not a fresh GitHub-hosted VM per
      # run), that's cumulative: real incident, 2026-07-24 — five days of
      # untouched dangling images/build cache pushed the shared disk to
      # 96% full, which tripped OpenSearch's flood-stage watermark and
      # crash-looped the next api pod on a completely unrelated PR.
      # `if: always()` so a failed deploy still gets cleaned up — that's
      # exactly the case most likely to leave extra dangling layers
      # behind.
      #
      # GitHub issue #530 (D85): the original `until=48h` grace window
      # made sense at ~1 run/day building 2 images; it now builds 4
      # (notification-service, review-analyzer added since) at a much
      # higher merge cadence, so same-day cache growth was tripping the
      # flood-stage watermark again before any of it aged past 48h.
      # Shortened to `until=6h` — recent-run reuse from same-day rebuilds
      # still applies, but growth is bounded to hours, not days.
      #
      # GitHub issue #540 (D90): ported straight from `docker image
      # prune`/`docker builder prune` to their podman equivalents — podman
      # doesn't have a separate `builder prune` subcommand, so build-cache
      # pruning folds into `system prune`'s own `--filter until=` instead.
      - name: Prune stale Podman artifacts
        if: always()
        run: |
          podman image prune -f
          podman system prune -f --filter until=6h

      # This host-level prune above is a *different* disk than the kind
      # node's own internal containerd store — a second real incident,
      # same day (2026-07-24): the node's own filesystem hit 91% full
      # from repeated `kind load` calls (each one leaves an untagged,
      # superseded image behind in the node's own store, not
      # the host's), tripping the same OpenSearch watermark again. Uses
      # infra/scripts/prune-kind-node-images.sh — deliberately not a
      # blind `crictl rmi --prune` (D35's own near-miss documented why:
      # kubelet tracks a running container by digest, not tag, so a tag
      # moving forward can leave a still-running pod depending on a
      # digest no longer reachable by any tag). The script instead
      # cross-references every pod's actual running image digest,
      # cluster-wide, before removing anything.
      - name: Prune orphaned kind-node images
        if: always()
        run: ./infra/scripts/prune-kind-node-images.sh interview-insights
