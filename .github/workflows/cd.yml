name: CD

# Real, automatic trigger (user's explicit decision, Phase 12) — not
# workflow_dispatch. Combined with the self-hosted runner being on-demand
# (issue #88), a push to main just queues this job until the runner is
# next started with `./run.sh` — reconciling "real" CD semantics with
# deliberate, session-scoped execution on a personal machine. Only
# triggers on changes that actually affect what's deployed; docs/blog-only
# merges don't queue a rebuild.
#
# Targets infra/k8s/overlays/dev-localstack, not the plain dev overlay
# (GitHub issue #99, docs/DECISIONS.md D23) — every redeploy now backs
# api's secrets with LocalStack Secrets Manager/IAM via an assumed role,
# reseeded fresh each run since LocalStack keeps no state across pod
# restarts. Requires the LOCALSTACK_AUTH_TOKEN repo secret to be set
# (`gh secret set LOCALSTACK_AUTH_TOKEN`) — a one-time manual step, since
# the token itself can't be provisioned by this workflow. Also requires
# ADMIN_PASSWORD_HASH and ADMIN_JWT_SECRET repo secrets (`gh secret set
# ADMIN_PASSWORD_HASH` / `gh secret set ADMIN_JWT_SECRET`, GitHub issue
# #192) — the real admin credential, never committed to a manifest.
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'web/**'
      - 'infra/k8s/**'

# A second push while an earlier deploy is still queued/running should
# win outright — only the latest main matters for a single local cluster.
concurrency:
  group: cd
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build api image
        run: |
          docker build -t interview-insights-api:k8s -f api/Dockerfile \
            --build-arg GIT_SHA=$(git rev-parse --short HEAD) api

      - name: Build web image
        run: |
          docker build -t interview-insights-web:k8s -f web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=http://api.interview-insights.local web

      - name: Load images into kind
        run: |
          kind load docker-image interview-insights-api:k8s interview-insights-web:k8s \
            --name interview-insights

      - name: Ensure namespace exists
        run: kubectl apply -f infra/k8s/base/00-namespace.yaml

      - name: Provision admin credentials secret
        # Must land before api's Deployment (created by the overlay apply
        # below) picks up its envFrom — same "doesn't hot-reload" ordering
        # requirement as the LocalStack step right after this one. Real
        # rotated values (GitHub issue #192) live only as repo secrets —
        # never in a git-tracked manifest, see 05-api.yaml's own comment.
        env:
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
        run: |
          kubectl create secret generic admin-credentials \
            --namespace interview-insights \
            --from-literal=ADMIN_PASSWORD_HASH="$ADMIN_PASSWORD_HASH" \
            --from-literal=ADMIN_JWT_SECRET="$ADMIN_JWT_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Provision LocalStack auth token secret
        # Must land before the overlay below creates the LocalStack pod —
        # same order as the manual walkthrough (wiki/deployment-guide.md
        # section 5): the Deployment reads this via secretKeyRef, which
        # doesn't hot-reload, so if the Secret didn't exist yet at pod
        # creation the pod would need a manual restart to pick it up.
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          kubectl create secret generic localstack-credentials \
            --namespace interview-insights \
            --from-literal=LOCALSTACK_AUTH_TOKEN="$LOCALSTACK_AUTH_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply the dev-localstack overlay
        run: kubectl apply -k infra/k8s/overlays/dev-localstack

      - name: Wait for LocalStack
        run: kubectl wait --for=condition=ready pod -l app=localstack -n interview-insights --timeout=120s

      - name: Seed LocalStack secrets + IAM
        run: |
          kubectl -n interview-insights port-forward svc/localstack 4566:4566 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 15); do
            curl -sf http://localhost:4566/_localstack/health > /dev/null && break
            sleep 2
          done
          ./infra/aws/seed-localstack.sh

      - name: Roll out api
        run: |
          kubectl -n interview-insights rollout restart deployment/api
          kubectl -n interview-insights rollout status deployment/api --timeout=90s

      - name: Roll out web
        run: |
          kubectl -n interview-insights rollout restart deployment/web
          kubectl -n interview-insights rollout status deployment/web --timeout=90s

      # Every run's "Build api/web image" step leaves the previous build's
      # now-untagged layers behind — `kind load docker-image` re-tags the
      # new one but never removes the old. On a persistent self-hosted
      # runner (issue #88 — this box, not a fresh GitHub-hosted VM per
      # run), that's cumulative: real incident, 2026-07-24 — five days of
      # untouched dangling images/build cache pushed the shared Docker
      # Desktop disk to 96% full, which tripped OpenSearch's flood-stage
      # watermark and crash-looped the next api pod on a completely
      # unrelated PR. `if: always()` so a failed deploy still gets cleaned
      # up — that's exactly the case most likely to leave extra dangling
      # layers behind.
      - name: Prune stale Docker artifacts
        if: always()
        run: |
          docker image prune -f
          docker builder prune -f --filter until=48h

      # This host-level prune above is a *different* disk than the kind
      # node's own internal containerd store — a second real incident,
      # same day (2026-07-24): the node's own filesystem hit 91% full
      # from repeated `kind load docker-image` calls (each one leaves an
      # untagged, superseded image behind in the node's own store, not
      # the host's), tripping the same OpenSearch watermark again. Uses
      # infra/scripts/prune-kind-node-images.sh — deliberately not a
      # blind `crictl rmi --prune` (D35's own near-miss documented why:
      # kubelet tracks a running container by digest, not tag, so a tag
      # moving forward can leave a still-running pod depending on a
      # digest no longer reachable by any tag). The script instead
      # cross-references every pod's actual running image digest,
      # cluster-wide, before removing anything.
      - name: Prune orphaned kind-node images
        if: always()
        run: ./infra/scripts/prune-kind-node-images.sh interview-insights
