name: CD (Hetzner pilot)

# GitHub issue #708 (Phase 46, D105) — a second CD workflow alongside
# cd.yml (kind/local target), not a replacement. Deploys
# infra/k8s/overlays/hetzner-pilot to the real, publicly-reachable
# Hetzner VM instead of the local kind cluster.
#
# workflow_dispatch, not an automatic push trigger like cd.yml — a
# deliberate choice: this is the only environment this project has ever
# run that's actually on the public internet, with a single replica per
# service and no staging buffer in front of it. Automate the trigger
# later once the pilot's proven stable, if that's ever actually wanted;
# starting manual matches this whole phase's own pattern (staging cert
# before production, live verification before trusting each step).
on:
  workflow_dispatch:

# A second run cancelling a real, in-progress deploy could leave the
# pilot in a torn state (secrets provisioned, overlay half-applied) —
# unlike cd.yml's disposable local kind cluster, let an in-flight deploy
# to the real pilot finish before starting another.
concurrency:
  group: cd-hetzner
  cancel-in-progress: false

# GitHub issue #804 (Phase 55) — defense-in-depth. GHCR auth here goes
# through the dedicated HETZNER_GHCR_PAT repo secret (docker login), not
# GITHUB_TOKEN, so this workflow never needs more than read access to it.
permissions:
  contents: read

jobs:
  # GitHub issue #761 (D111) — web's Next.js/SWC production build
  # reproducibly segfaults under the self-hosted runner's cross-arch
  # QEMU emulation (see D109 for the full application-level debugging
  # trail, D110 for why an ARM64 VM migration was reverted instead of
  # fixing this). Genuinely native x86_64 hardware sidesteps the whole
  # class of bug — no emulation, nothing to segfault. GitHub-hosted,
  # not self-hosted: D82's self-hosted-runner decision was driven by a
  # billing gate from *automatic, per-push* CI minutes and a private-repo
  # security posture (no fork-PR attack surface to begin with, since this
  # repo is private) — neither concern applies to one occasional job in a
  # workflow_dispatch-only workflow. Plain `docker`, not `podman`:
  # ubuntu-latest ships Docker preinstalled; introducing podman here for
  # one job isn't worth it.
  build-web-image:
    runs-on: ubuntu-latest
    steps:
      # GitHub issue #808 (Phase 55) — pinned to the commit SHA v4
      # currently resolves to, not the floating tag: a credential-bearing
      # deploy workflow, so a tag-move attack upstream must never silently
      # pull in new code here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Determine image tag
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GHCR_PAT: ${{ secrets.HETZNER_GHCR_PAT }}
        run: printf '%s' "$GHCR_PAT" | docker login ghcr.io -u GowthamSiddarth --password-stdin

      - name: Build & push web image
        # NEXT_PUBLIC_API_URL is baked in at build time (web/Dockerfile) —
        # this is a genuinely different build than dev's/staging's/prod's
        # own, not a re-tag, same reasoning overlays/staging's own
        # kustomization.yaml already documents for itself.
        run: |
          IMG="ghcr.io/gowthamsiddarth/interview-insights-web:${{ steps.tag.outputs.tag }}"
          docker build -t "$IMG" -f web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL=https://api.interviewinsights.fyi web
          docker push "$IMG"

  # GitHub issue #214 epic (ad-hoc perf follow-up) — api/notification-
  # service/review-analyzer used to build sequentially inside the
  # `deploy` job on the one self-hosted Mac runner (~6 min serial,
  # cross-arch QEMU emulation the whole time). Moved to a 3-way matrix
  # on ubuntu-latest instead, for two independent reasons: (1)
  # ubuntu-latest is natively x86_64 — the same architecture as the
  # Hetzner VM — so these builds need zero cross-arch emulation here,
  # not just "emulation that happens to work" like the old self-hosted
  # path; (2) GitHub schedules separate matrix legs on separate
  # ephemeral runners, so they build genuinely in parallel, unlike a
  # matrix on the self-hosted runner would (only one machine holds that
  # runner label, so legs there would just queue behind each other).
  # Same GitHub-hosted-doesn't-reopen-D82 reasoning as `build-web-image`
  # (D111) applies identically: workflow_dispatch-only, private repo, no
  # fork-PR surface. Plain `docker`, not `podman`, matching
  # `build-web-image`'s own precedent for the same reason (ubuntu-latest
  # ships Docker preinstalled).
  build-images:
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: api/Dockerfile
            context: api
          - name: notification-service
            dockerfile: services/notification-service/Dockerfile
            context: services/notification-service
          - name: review-analyzer
            dockerfile: services/review-analyzer/Dockerfile
            context: services/review-analyzer
    runs-on: ubuntu-latest
    steps:
      # GitHub issue #808 (Phase 55) — pinned to the commit SHA v4
      # currently resolves to, not the floating tag: a credential-bearing
      # deploy workflow, so a tag-move attack upstream must never silently
      # pull in new code here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Determine image tag
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        env:
          GHCR_PAT: ${{ secrets.HETZNER_GHCR_PAT }}
        run: printf '%s' "$GHCR_PAT" | docker login ghcr.io -u GowthamSiddarth --password-stdin

      - name: Build & push ${{ matrix.name }} image
        run: |
          IMG="ghcr.io/gowthamsiddarth/interview-insights-${{ matrix.name }}:${{ steps.tag.outputs.tag }}"
          docker build -t "$IMG" -f ${{ matrix.dockerfile }} \
            --build-arg GIT_SHA=${{ steps.tag.outputs.tag }} ${{ matrix.context }}
          docker push "$IMG"

  deploy:
    needs: [build-web-image, build-images]
    # GitHub issue #214 epic (ad-hoc follow-up) — moved off the
    # self-hosted Mac entirely, same direction as build-web-image
    # (D111)/build-images above. The Mac's own involvement in this job
    # was never about building images (that only ever happened in the
    # old sequential-build version of this job) — it was the one machine
    # holding the SSH private key that can reach the pilot's k3s API,
    # since port 6443 is deliberately closed in the Cloud Firewall
    # (#659) and SSH is the only path in (#668). That key now lives as
    # the `HETZNER_SSH_PRIVATE_KEY` repo secret instead (see
    # docs/SECRETS.md), so this job opens its own SSH tunnel on a
    # GitHub-hosted runner rather than reusing
    # infra/scripts/hetzner-pilot-tunnel.sh, which is deliberately
    # launchd-based (macOS-only, built for the operator's own persistent
    # local access, #668) — a plain backgrounded `ssh -f -N` is all a
    # single ephemeral CI job needs, no KeepAlive/relaunch machinery.
    # The operator's own local tunnel script/access is unaffected by
    # this change.
    runs-on: ubuntu-latest
    steps:
      # GitHub issue #808 (Phase 55) — pinned to the commit SHA v4
      # currently resolves to, not the floating tag: a credential-bearing
      # deploy workflow, so a tag-move attack upstream must never silently
      # pull in new code here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Determine image tag
        id: tag
        # Recomputed identically here rather than reused from the
        # build-web-image/build-images jobs' own outputs — every job
        # checks out the same commit (workflow_dispatch), so
        # `git rev-parse --short HEAD` is deterministically the same
        # value either way; no cross-job output wiring needed for this
        # one.
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Inline, not infra/scripts/hetzner-pilot-tunnel.sh (see the job
      # comment above for why). StrictHostKeyChecking=accept-new needs
      # no stale-entry purge here (unlike the operator's own script,
      # #763) — this runner's known_hosts starts empty every run, so
      # there's never a *different* cached key to conflict with, only
      # ever a first-time trust decision.
      - name: Open SSH tunnel to the pilot k3s API
        env:
          HETZNER_VM_IP: ${{ vars.HETZNER_VM_IP }}
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$HETZNER_SSH_PRIVATE_KEY" ]; then
            echo "::error::HETZNER_SSH_PRIVATE_KEY is unset - run: gh secret set HETZNER_SSH_PRIVATE_KEY < ~/.ssh/hetzner-vm (see docs/SECRETS.md)."
            exit 1
          fi

          KEY_FILE="$RUNNER_TEMP/hetzner-vm-key"
          umask 077
          printf '%s\n' "$HETZNER_SSH_PRIVATE_KEY" > "$KEY_FILE"

          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes -i "$KEY_FILE")

          ssh -f -N -o ExitOnForwardFailure=yes "${SSH_OPTS[@]}" \
            -L 6443:localhost:6443 "deploy@${HETZNER_VM_IP}"

          # Same kubeconfig-fetch this repo's own refresh_kubeconfig()
          # does (infra/scripts/hetzner-pilot-tunnel.sh) — server IP
          # rewritten to 127.0.0.1 so the returned kubeconfig talks
          # through the tunnel above, not the VM's real IP directly
          # (6443 isn't reachable that way from here either).
          ssh -o ConnectTimeout=10 "${SSH_OPTS[@]}" "deploy@${HETZNER_VM_IP}" \
            'sudo cat /etc/rancher/k3s/k3s.yaml' \
            | sed "s/${HETZNER_VM_IP//./\\.}/127.0.0.1/" > "$RUNNER_TEMP/kubeconfig.yaml"
          chmod 600 "$RUNNER_TEMP/kubeconfig.yaml"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig.yaml" >> "$GITHUB_ENV"

      - name: Wait for the tunnel to be usable
        run: |
          for i in $(seq 1 15); do
            kubectl get nodes >/dev/null 2>&1 && break
            sleep 2
          done
          kubectl get nodes

      - name: Ensure namespace exists
        run: kubectl apply -f infra/k8s/base/00-namespace.yaml

      - name: Provision Postgres credentials secret
        # Same #568 empty-value guard as cd.yml's own equivalent step.
        env:
          POSTGRES_PASSWORD: ${{ secrets.HETZNER_POSTGRES_PASSWORD }}
        run: |
          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "::error::HETZNER_POSTGRES_PASSWORD resolved empty - refusing to overwrite postgres-credentials. Re-run if it was just rotated mid-flight."
            exit 1
          fi
          kubectl create secret generic postgres-credentials \
            --namespace interview-insights \
            --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Provision api-secrets
        env:
          DATABASE_URL: ${{ secrets.HETZNER_DATABASE_URL }}
          EMAIL_HASH_SECRET: ${{ secrets.HETZNER_EMAIL_HASH_SECRET }}
          EMAIL_ENCRYPTION_KEY: ${{ secrets.HETZNER_EMAIL_ENCRYPTION_KEY }}
          CANDIDATE_JWT_SECRET: ${{ secrets.HETZNER_CANDIDATE_JWT_SECRET }}
          ADMIN_PASSWORD_HASH: ${{ secrets.HETZNER_ADMIN_PASSWORD_HASH }}
          ADMIN_JWT_SECRET: ${{ secrets.HETZNER_ADMIN_JWT_SECRET }}
          MAIL_SMTP_PASSWORD: ${{ secrets.HETZNER_MAIL_SMTP_PASSWORD }}
        run: |
          kubectl create secret generic api-secrets \
            --namespace interview-insights \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=EMAIL_HASH_SECRET="$EMAIL_HASH_SECRET" \
            --from-literal=EMAIL_ENCRYPTION_KEY="$EMAIL_ENCRYPTION_KEY" \
            --from-literal=CANDIDATE_JWT_SECRET="$CANDIDATE_JWT_SECRET" \
            --from-literal=ADMIN_PASSWORD_HASH="$ADMIN_PASSWORD_HASH" \
            --from-literal=ADMIN_JWT_SECRET="$ADMIN_JWT_SECRET" \
            --from-literal=MAIL_SMTP_PASSWORD="$MAIL_SMTP_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Provision notification-service-secrets
        env:
          DATABASE_URL: ${{ secrets.HETZNER_DATABASE_URL }}
          EMAIL_ENCRYPTION_KEY: ${{ secrets.HETZNER_EMAIL_ENCRYPTION_KEY }}
          MAIL_SMTP_PASSWORD: ${{ secrets.HETZNER_MAIL_SMTP_PASSWORD }}
        run: |
          kubectl create secret generic notification-service-secrets \
            --namespace interview-insights \
            --from-literal=DATABASE_URL="$DATABASE_URL" \
            --from-literal=EMAIL_ENCRYPTION_KEY="$EMAIL_ENCRYPTION_KEY" \
            --from-literal=MAIL_SMTP_PASSWORD="$MAIL_SMTP_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Provision review-analyzer-secrets
        # ANTHROPIC_API_KEY is genuinely optional (docs/SECRETS.md's
        # "absent, not empty" rule) — an unset repo secret just deploys
        # with AI moderation triage disabled, same as cd.yml's own
        # equivalent step.
        env:
          DATABASE_URL: ${{ secrets.HETZNER_DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.HETZNER_ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            kubectl create secret generic review-analyzer-secrets \
              --namespace interview-insights \
              --from-literal=DATABASE_URL="$DATABASE_URL" \
              --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
              --dry-run=client -o yaml | kubectl apply -f -
          else
            kubectl create secret generic review-analyzer-secrets \
              --namespace interview-insights \
              --from-literal=DATABASE_URL="$DATABASE_URL" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

      - name: Provision ghcr-pull-secret
        env:
          GHCR_PAT: ${{ secrets.HETZNER_GHCR_PAT }}
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace interview-insights \
            --docker-server=ghcr.io \
            --docker-username=GowthamSiddarth \
            --docker-password="$GHCR_PAT" \
            --docker-email=unused@example.com \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Set this run's image tags
        # Mutates the checked-out copy only — never committed back. The
        # placeholder in git is never what actually gets deployed.
        # GNU sed (ubuntu-latest), not BSD sed's `-i ''` — this job no
        # longer runs on the (BSD-sed) self-hosted Mac.
        run: |
          sed -i "s/PILOT_IMAGE_TAG_PLACEHOLDER/${{ steps.tag.outputs.tag }}/g" \
            infra/k8s/overlays/hetzner-pilot/kustomization.yaml

      - name: Apply the hetzner-pilot overlay
        run: kubectl apply -k infra/k8s/overlays/hetzner-pilot

      - name: Roll out api
        run: |
          kubectl -n interview-insights rollout restart deployment/api
          kubectl -n interview-insights rollout status deployment/api --timeout=120s

      - name: Roll out web
        run: |
          kubectl -n interview-insights rollout restart deployment/web
          kubectl -n interview-insights rollout status deployment/web --timeout=120s

      - name: Roll out notification-service
        run: |
          kubectl -n interview-insights rollout restart deployment/notification-service
          kubectl -n interview-insights rollout status deployment/notification-service --timeout=120s

      - name: Roll out review-analyzer
        run: |
          kubectl -n interview-insights rollout restart deployment/review-analyzer
          kubectl -n interview-insights rollout status deployment/review-analyzer --timeout=120s

      - name: Close the SSH tunnel
        # Best-effort only — this is an ephemeral GitHub-hosted runner,
        # destroyed at job end either way; this just closes the
        # forwarded port cleanly rather than leaving it open for the
        # remaining seconds of the job's teardown.
        if: always()
        run: pkill -f 'ssh .*-L 6443:localhost:6443' || true
